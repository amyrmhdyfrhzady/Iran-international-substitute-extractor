name: Iran International Subtitle API

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */5 * * *"

permissions:
  contents: write

concurrency:
  group: iranintl-subtitle-api
  cancel-in-progress: false

jobs:
  worker:
    runs-on: ubuntu-24.04
    timeout-minutes: 295

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            tesseract-ocr \
            tesseract-ocr-fas \
            ffmpeg \
            libnss3 \
            libatk-bridge2.0-0 \
            libgtk-3-0 \
            libgbm1 \
            libasound2t64

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install chromium

      - name: Run five-hour worker
        run: python -m src.main

      - name: Upload debug files if present
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iranintl-debug-${{ github.run_id }}
          path: |
            debug/
          if-no-files-found: ignore
          retention-days: 2

      - name: Final API commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/news.json
          if git diff --cached --quiet; then
            echo "No API changes."
          else
            git commit -m "Update subtitle API"
            git push
          fi
